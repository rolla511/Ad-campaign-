<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoters — Party Booster</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding: 40px 20px;">
    <h1 style="margin-bottom: 30px;">Find Promoters & Creators</h1>

    <div class="search-bar">
      <input type="text" id="searchCity" placeholder="Search by city...">
      <select id="searchType">
        <option value="">All Types</option>
        <option value="content_creator">Content Creator</option>
        <option value="streamer">Streamer</option>
        <option value="model">Model</option>
        <option value="dancer">Dancer</option>
        <option value="artist">Artist</option>
        <option value="dj">DJ</option>
        <option value="influencer">Influencer</option>
      </select>
      <select id="searchService">
        <option value="">All Services</option>
        <option value="promotion">Promotion Only</option>
        <option value="appearance">Appearance</option>
        <option value="both">Both</option>
      </select>
      <button class="btn btn-primary" onclick="loadPromoters()">Search</button>
    </div>

    <div id="promotersContainer" class="events-grid">
      <div class="loading">Loading promoters</div>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <script src="js/app.js?v=4"></script>
  <script>
    let currentPage = 1;

    async function loadPromoters(page = 1) {
      currentPage = page;
      const container = document.getElementById('promotersContainer');
      container.innerHTML = '<div class="loading">Loading promoters</div>';

      const params = new URLSearchParams();
      params.append('page', page);
      params.append('limit', 12);

      const city = document.getElementById('searchCity').value;
      const type = document.getElementById('searchType').value;
      const serviceType = document.getElementById('searchService').value;

      if (city) params.append('city', city);
      if (type) params.append('type', type);
      if (serviceType) params.append('serviceType', serviceType);

      try {
        const data = await Auth.api(`/promoters/search?${params}`);
        renderPromoters(data.promoters);
        renderPagination(data.pagination);
      } catch (err) {
        container.innerHTML = `<p style="color:var(--danger);">${err.message}</p>`;
      }
    }

    function renderPromoters(promoters) {
      const container = document.getElementById('promotersContainer');
      if (promoters.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--gray);">No promoters found.</p>';
        return;
      }

      container.innerHTML = promoters.map(p => `
        <div class="event-card">
          <div class="event-card-image" style="font-size:3rem;">
            ${getPromoterEmoji(p.promoter_type)}
          </div>
          <div class="event-card-body">
            <h3>${escapeMarkup(p.stage_name || p.full_name || p.username)}</h3>
            <p class="profile-type">${escapeMarkup(formatPromoterType(p.profile_type || p.promoter_type))}</p>
            <div>
              ${(p.service_types || []).map(s => `<span class="tag tag-success">${s}</span>`).join('')}
            </div>
            <div class="event-meta">
              <span>${p.is_verified ? 'Billing verified' : 'Unverified profile'}</span>
              ${p.user_tier !== 'free' ? `
                <span>👥 ${formatNumber(p.total_followers || 0)} followers</span>
                <span>⭐ ${p.rating ? p.rating.toFixed(1) : 'New'}</span>
                <span>🎪 ${p.total_events || 0} events</span>
              ` : ''}
            </div>
            ${p.min_fee ? `<p style="margin-top:10px;"><strong>$${p.min_fee}</strong>${p.max_fee ? ` - $${p.max_fee}` : '+'} / event</p>` : ''}
            <div style="margin-top:15px;">
              <a href="promoter-profile.html?id=${p.id}" class="btn btn-outline" style="padding:8px 16px; font-size:0.9rem;">View Profile</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function getPromoterEmoji(type) {
      const emojis = {
        content_creator: '📱',
        streamer: '🎮',
        model: '📸',
        dancer: '💃',
        artist: '🎨',
        dj: '🎧',
        influencer: '⭐',
        other: '🎉'
      };
      return emojis[type] || '🎉';
    }

    function formatPromoterType(type) {
      return type.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function renderPagination(pagination) {
      const container = document.getElementById('pagination');
      if (pagination.pages <= 1) {
        container.innerHTML = '';
        return;
      }
      let html = '';
      for (let i = 1; i <= pagination.pages; i++) {
        html += `<button class="${i === pagination.page ? 'active' : ''}" onclick="loadPromoters(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    loadPromoters();
  </script>
</body>
</html>
