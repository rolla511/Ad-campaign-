<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Party Booster</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="form-container signup-form">
    <h1>Messages</h1>
    <p>Agree on booking terms here and pay each other directly. Party Booster does not collect booking payments or handle booking refunds.</p>
    <p id="messageStatus" role="status"></p>
    <ul id="messageThreads" class="lead-list"></ul>
    <section id="conversation" hidden>
      <h2>Conversation</h2>
      <div id="messageList" class="lead-list"></div>
      <form id="messageForm">
        <div class="form-group"><label for="messageText">Your message</label><textarea id="messageText" maxlength="2000" required></textarea></div>
        <button class="btn btn-primary" type="submit">Send message</button>
        <a href="messages.html" class="btn btn-outline">All conversations</a>
      </form>
    </section>
  </main>
  <script src="js/app.js?v=4"></script>
  <script>
    if (requireAuth()) {
      const current = Auth.getUser();
      const status = document.getElementById('messageStatus');
      const query = new URLSearchParams(window.location.search);
      const userId = query.get('userId');
      const eventId = query.get('eventId');
      const bookingId = query.get('bookingId');
      const hasConversation = /^[1-9][0-9]*$/.test(userId || '') &&
        [eventId, bookingId].some(id => /^[1-9][0-9]*$/.test(id || ''));

      async function loadThreads() {
        try {
          const threads = await Auth.api('/messages/threads');
          const list = document.getElementById('messageThreads');
          for (const thread of threads) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            const params = new URLSearchParams({ userId: thread.peer_id });
            if (thread.event_id) params.set('eventId', thread.event_id);
            if (thread.booking_id) params.set('bookingId', thread.booking_id);
            link.href = 'messages.html?' + params;
            link.textContent = '@' + thread.username + (thread.event_title ? ' · ' + thread.event_title : '');
            item.append(link);
            list.append(item);
          }
          if (!threads.length) status.textContent = 'Start a conversation from a matched event in Leads.';
        } catch (error) { status.textContent = error.message; }
      }

      async function loadConversation() {
        try {
          const params = new URLSearchParams({ userId });
          if (eventId) params.set('eventId', eventId);
          if (bookingId) params.set('bookingId', bookingId);
          const messages = await Auth.api('/messages/conversation?' + params);
          const cards = messages.map(message => {
            const card = document.createElement('article');
            card.className = 'lead-card';
            const sender = document.createElement('strong');
            sender.textContent = '@' + message.sender_username;
            const text = document.createElement('p');
            text.textContent = message.message;
            card.append(sender, text);
            return card;
          });
          document.getElementById('messageList').replaceChildren(...cards);
          status.textContent = messages.length ? '' : 'Start the conversation to agree on booking details.';
          document.getElementById('conversation').hidden = false;
          const unread = messages.filter(message => !message.is_read && Number(message.recipient_id) === Number(current.id))
            .map(message => message.id).slice(0, 100);
          if (unread.length) await Auth.api('/messages/read', { method: 'POST', body: JSON.stringify({ messageIds: unread }) });
        } catch (error) { status.textContent = error.message; }
      }

      if (!hasConversation) void loadThreads();
      else {
        void loadConversation();
        document.getElementById('messageForm').addEventListener('submit', async event => {
          event.preventDefault();
          const button = event.submitter;
          button.disabled = true;
          const text = document.getElementById('messageText');
          try {
            await Auth.api('/messages', {
              method: 'POST', body: JSON.stringify({ recipientId: userId, eventId, bookingId, message: text.value.trim() })
            });
            text.value = '';
            await loadConversation();
          } catch (error) { status.textContent = error.message; }
          finally { button.disabled = false; }
        });
      }
    }
  </script>
</body>
</html>
