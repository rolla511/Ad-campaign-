<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Party Booster</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container discover-page">
    <h1>Discover Events</h1>

    <form class="event-filters" id="eventFilters">
      <label>City <input type="search" name="city" placeholder="Any city"></label>
      <label>Genre <input type="search" name="genre" placeholder="Any genre"></label>
      <label>From <input type="date" name="startDate"></label>
      <label>To <input type="date" name="endDate"></label>
      <div class="filter-actions">
        <button type="submit" class="btn btn-primary">Search</button>
        <button type="button" class="btn btn-outline" id="clearFilters">Clear</button>
      </div>
    </form>

    <div id="eventsContainer" class="events-grid" aria-busy="true"></div>
    <nav id="pagination" class="pagination" aria-label="Event result pages"></nav>
  </main>

  <script src="js/app.js?v=2"></script>
  <script>
    const filters = document.getElementById('eventFilters');
    const results = document.getElementById('eventsContainer');
    const pagination = document.getElementById('pagination');
    const initial = new URLSearchParams(window.location.search);
    let requestId = 0;

    for (const field of filters.querySelectorAll('input')) {
      field.value = initial.get(field.name) || '';
    }

    function renderState(title, description, action, onAction) {
      const panel = document.createElement('div');
      panel.className = 'results-state';
      panel.setAttribute('role', 'status');
      const heading = document.createElement('h2');
      heading.textContent = title;
      panel.append(heading);

      if (description) {
        const text = document.createElement('p');
        text.textContent = description;
        panel.append(text);
      }

      if (action) {
        const button = document.createElement('button');
        button.className = 'btn btn-outline';
        button.textContent = action;
        button.addEventListener('click', onAction);
        panel.append(button);
      }
      results.replaceChildren(panel);
    }

    async function loadEvents(page = 1) {
      const id = ++requestId;
      const query = new URLSearchParams();
      for (const [name, value] of new FormData(filters)) {
        if (value.trim()) query.set(name, value.trim());
      }
      const filtered = query.size > 0;
      if (page > 1) query.set('page', page);
      history.replaceState(null, '', query.size ? '?' + query : window.location.pathname);
      query.set('page', page);
      query.set('limit', '12');

      results.setAttribute('aria-busy', 'true');
      renderState('Loading events…');
      pagination.replaceChildren();
      try {
        const data = await Auth.api(`/events?${query}`);
        if (id !== requestId) return;
        if (data.events.length) {
          renderEvents(data.events);
          renderPagination(data.pagination);
        } else if (filtered) {
          renderState('No matching events', 'Try a different city, genre, or date range.', 'Clear filters', resetFilters);
        } else {
          renderState('No events yet', 'Published events will appear here.');
        }
      } catch {
        if (id !== requestId) return;
        renderState('Events are temporarily unavailable', 'Your filters are still here.', 'Try again', () => loadEvents(page));
      } finally {
        if (id === requestId) results.setAttribute('aria-busy', 'false');
      }
    }

    function appendText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.append(element);
      return element;
    }

    function renderEvents(events) {
      const cards = events.map(event => {
        const card = document.createElement('article');
        card.className = 'event-card';
        appendText(card, 'div', formatDate(event.start_date), 'event-card-date');
        const body = appendText(card, 'div', '', 'event-card-body');
        appendText(body, 'h2', event.title);
        const location = [event.city, event.state].filter(Boolean).join(', ');
        if (location) appendText(body, 'p', location, 'event-card-location');
        if (event.description) {
          const summary = event.description.length > 120
            ? event.description.slice(0, 120).trimEnd() + '…'
            : event.description;
          appendText(body, 'p', summary);
        }
        if (event.genre_tags?.length) {
          const genres = appendText(body, 'div', '', 'event-card-tags');
          for (const genre of event.genre_tags) appendText(genres, 'span', genre, 'tag');
        }
        if (event.ticket_price_min != null) {
          const range = event.ticket_price_max != null ? ` – $${event.ticket_price_max}` : '';
          appendText(body, 'p', `$${event.ticket_price_min}${range}`, 'event-card-price');
        }
        const details = appendText(body, 'a', 'View details', 'btn btn-outline');
        details.href = `event-detail.html?${new URLSearchParams({ id: event.id })}`;
        details.setAttribute('aria-label', `View details for ${event.title}`);
        return card;
      });
      results.replaceChildren(...cards);
    }

    function renderPagination({ page, pages }) {
      if (pages <= 1) return;
      const previous = appendText(pagination, 'button', 'Previous');
      previous.disabled = page <= 1;
      previous.addEventListener('click', () => loadEvents(page - 1));
      appendText(pagination, 'span', `Page ${page} of ${pages}`);
      const next = appendText(pagination, 'button', 'Next');
      next.disabled = page >= pages;
      next.addEventListener('click', () => loadEvents(page + 1));
    }

    function resetFilters() {
      filters.reset();
      loadEvents();
    }

    filters.addEventListener('submit', event => {
      event.preventDefault();
      loadEvents();
    });
    document.getElementById('clearFilters').addEventListener('click', resetFilters);
    const firstPage = Number.parseInt(initial.get('page'), 10);
    loadEvents(firstPage > 0 ? firstPage : 1);
  </script>
</body>
</html>
