<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Party Booster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding: 40px 20px;">
    <h1 style="margin-bottom: 30px;">Discover Events</h1>

    <div class="search-bar">
      <input type="text" id="searchCity" placeholder="Search by city...">
      <input type="text" id="searchGenre" placeholder="Search by genre...">
      <input type="date" id="searchStartDate">
      <input type="date" id="searchEndDate">
      <button class="btn btn-primary" onclick="loadEvents()">Search</button>
    </div>

    <div id="eventsContainer" class="events-grid">
      <div class="loading">Loading events</div>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let currentPage = 1;

    async function loadEvents(page = 1) {
      currentPage = page;
      const container = document.getElementById('eventsContainer');
      container.innerHTML = '<div class="loading">Loading events</div>';

      const params = new URLSearchParams();
      params.append('page', page);
      params.append('limit', 12);

      const city = document.getElementById('searchCity').value;
      const genre = document.getElementById('searchGenre').value;
      const startDate = document.getElementById('searchStartDate').value;
      const endDate = document.getElementById('searchEndDate').value;

      if (city) params.append('city', city);
      if (genre) params.append('genre', genre);
      if (startDate) params.append('startDate', startDate);
      if (endDate) params.append('endDate', endDate);

      try {
        const data = await Auth.api(`/events?${params}`);
        renderEvents(data.events);
        renderPagination(data.pagination);
      } catch (err) {
        container.innerHTML = `<p style="color:var(--danger);">${err.message}</p>`;
      }
    }

    function renderEvents(events) {
      const container = document.getElementById('eventsContainer');
      if (events.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--gray);">No events found.</p>';
        return;
      }

      container.innerHTML = events.map(event => `
        <div class="event-card">
          <div class="event-card-image">🎉</div>
          <div class="event-card-body">
            <h3>${event.title}</h3>
            <p>${event.description ? event.description.substring(0, 100) + '...' : 'No description'}</p>
            <div>
              ${(event.genre_tags || []).map(g => `<span class="tag">${g}</span>`).join('')}
            </div>
            <div class="event-meta">
              <span>📅 ${formatDate(event.start_date)}</span>
              <span>📍 ${event.city || 'Unknown'}, ${event.state || ''}</span>
              <span>🎭 ${event.event_type || 'Event'}</span>
            </div>
            ${event.ticket_price_min ? `<p style="margin-top:10px;"><strong>$${event.ticket_price_min}</strong>${event.ticket_price_max ? ` - $${event.ticket_price_max}` : ''}</p>` : ''}
            <div style="margin-top:15px;">
              <a href="event-detail.html?id=${event.id}" class="btn btn-outline" style="padding:8px 16px; font-size:0.9rem;">View Details</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderPagination(pagination) {
      const container = document.getElementById('pagination');
      if (pagination.pages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 1; i <= pagination.pages; i++) {
        html += `<button class="${i === pagination.page ? 'active' : ''}" onclick="loadEvents(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    loadEvents();
  </script>
</body>
</html>
