<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event — Party Booster</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="form-container" style="max-width:700px;">
    <h2>Create Your Event</h2>
    <div id="message"></div>
    <form id="eventForm">
      <div class="form-group">
        <label for="title">Event Title *</label>
        <input type="text" id="title" required>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description"></textarea>
      </div>
      <div class="form-group">
        <label for="eventType">Event Type</label>
        <select id="eventType">
          <option value="concert">Concert</option>
          <option value="festival">Festival</option>
          <option value="club-night">Club Night</option>
          <option value="private-party">Private Party</option>
          <option value="rave">Rave</option>
          <option value="block-party">Block Party</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="venueName">Venue Name</label>
        <input type="text" id="venueName">
      </div>
      <div class="form-group">
        <label for="venueAddress">Venue Address</label>
        <input type="text" id="venueAddress">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">City *</label>
          <input type="text" id="city" required>
        </div>
        <div class="form-group">
          <label for="state">State *</label>
          <input type="text" id="state" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input type="number" id="latitude" step="any" placeholder="e.g. 34.0522">
        </div>
        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input type="number" id="longitude" step="any" placeholder="e.g. -118.2437">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="startDate">Start Date & Time *</label>
          <input type="datetime-local" id="startDate" required>
        </div>
        <div class="form-group">
          <label for="endDate">End Date & Time</label>
          <input type="datetime-local" id="endDate">
        </div>
      </div>
      <div class="form-group">
        <label for="genreTags">Genre Tags (comma-separated)</label>
        <input type="text" id="genreTags" placeholder="e.g. electronic, hip-hop, pop">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ticketPriceMin">Min Ticket Price ($)</label>
          <input type="number" id="ticketPriceMin" step="0.01">
        </div>
        <div class="form-group">
          <label for="ticketPriceMax">Max Ticket Price ($)</label>
          <input type="number" id="ticketPriceMax" step="0.01">
        </div>
      </div>
      <div class="form-group">
        <label for="capacity">Capacity</label>
        <input type="number" id="capacity">
      </div>
      <div class="form-group">
        <label for="ticketUrl">Ticket URL</label>
        <input type="url" id="ticketUrl" placeholder="https://...">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create Event</button>
    </form>
  </div>

  <script src="js/app.js?v=2"></script>
  <script>
    async function createEvent(e) {
      e.preventDefault();
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = '';

      const genreTagsStr = document.getElementById('genreTags').value;
      const genreTags = genreTagsStr ? genreTagsStr.split(',').map(g => g.trim()).filter(g => g) : [];

      const body = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        eventType: document.getElementById('eventType').value,
        venueName: document.getElementById('venueName').value,
        venueAddress: document.getElementById('venueAddress').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        latitude: document.getElementById('latitude').value || undefined,
        longitude: document.getElementById('longitude').value || undefined,
        startDate: new Date(document.getElementById('startDate').value).toISOString(),
        endDate: document.getElementById('endDate').value
          ? new Date(document.getElementById('endDate').value).toISOString()
          : undefined,
        genreTags: genreTags.length ? genreTags : undefined,
        ticketPriceMin: document.getElementById('ticketPriceMin').value || undefined,
        ticketPriceMax: document.getElementById('ticketPriceMax').value || undefined,
        capacity: document.getElementById('capacity').value || undefined,
        ticketUrl: document.getElementById('ticketUrl').value || undefined
      };

      try {
        const data = await Auth.api('/events', {
          method: 'POST',
          body: JSON.stringify(body)
        });
        showSuccess('Event created successfully!', messageDiv);
        setTimeout(() => {
          window.location.href = `event-detail.html?id=${data.id}`;
        }, 1500);
      } catch (err) {
        showError(err.message, messageDiv);
      }
    }

    if (requireAuth()) {
      document.getElementById('eventForm').addEventListener('submit', createEvent);
    }
  </script>
</body>
</html>
