<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Party Booster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="form-container">
    <h2>Login to Party Booster</h2>
    <div id="message"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
    <p style="text-align:center; margin-top:20px; color:var(--gray);">
      Don't have an account? <a href="register.html" style="color:var(--primary);">Sign up</a>
    </p>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      messageDiv.innerHTML = '';

      try {
        const data = await Auth.api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        Auth.setToken(data.token);
        showSuccess('Login successful! Redirecting...', messageDiv);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (err) {
        showError(err.message, messageDiv);
      }
    });
  </script>
</body>
</html>
