<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Party Booster</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🎉 Party Booster</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="promoters.html">Promoters</a></li>
        <li id="authLinks">
          <a href="login.html" class="btn btn-outline">Login</a>
          <a href="register.html" class="btn btn-primary">Sign Up</a>
        </li>
        <li id="userLinks" style="display:none;">
          <a href="create-event.html" class="btn btn-primary">Create Event</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="#" id="logoutBtn">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="form-container auth-form">
    <h1>Log in to Party Booster</h1>
    <div id="message" class="auth-error" role="alert" hidden></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary form-submit">Log in</button>
    </form>
    <p class="form-footer">
      New to Party Booster? <a href="register.html" id="registerLink">Create an account</a>
    </p>
  </main>

  <script src="js/app.js?v=2"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    carrySignInDestination(document.getElementById('registerLink'));
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submit = loginForm.querySelector('button[type="submit"]');
      if (submit.disabled) return;
      submit.disabled = true;
      submit.textContent = 'Logging in…';
      loginForm.setAttribute('aria-busy', 'true');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      messageDiv.hidden = true;

      try {
        const data = await Auth.api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        Auth.setToken(data.token);
        window.location.replace(getSignInDestination());
      } catch (err) {
        messageDiv.textContent = err.message;
        messageDiv.hidden = false;
      } finally {
        submit.disabled = false;
        submit.textContent = 'Log in';
        loginForm.setAttribute('aria-busy', 'false');
      }
    });
  </script>
</body>
</html>
