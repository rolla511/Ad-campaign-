<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AW Roadside | Pre-Signup Screening</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../Aw-styles.css"/>
<style>
  label { display: flex; flex-direction: column; gap: 8px; }
  .guide-box { margin: 16px 0 20px; border-radius: 12px; padding: 14px; border: 1px solid rgba(255, 204, 0, 0.35); background: linear-gradient(120deg, rgba(255, 204, 0, 0.1), rgba(255, 62, 62, 0.08)); display: flex; gap: 12px; align-items: center; }
  .guide-avatar { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffd84d, #ff3e3e); animation: bob 1.8s ease-in-out infinite; }
  .guide-message { color: #fff; font-size: 0.95rem; }
  @keyframes bob { 0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)} }
</style>
</head>
<body>
<div class="page-shell">
  <main class="pre-signup-container">
    <div class="guide-box" id="guide-box" aria-live="polite">
      <div class="guide-avatar" aria-hidden="true"></div>
      <div class="guide-message" id="guide-message"><strong>Pilot tip:</strong> Complete PayPal approval first, then submit.</div>
    </div>

    <form class="panel form-grid" id="pre-signup-form">
      <input type="hidden" name="role" id="input-role" value="SUBSCRIBER"/>
      <input type="hidden" name="amount" value="10.99"/>
      <input type="hidden" name="currency" value="USD"/>

      <label><span>Full Name</span><input class="field" name="fullName" placeholder="Full Name" required/></label>
      <label><span>Email</span><input class="field" name="email" type="email" placeholder="email@example.com" required/></label>
      <label><span>Phone Number</span><input class="field" name="phoneNumber" placeholder="Phone Number" required/></label>
      <label><span>ZIP Code</span><input class="field" name="zip" placeholder="ZIP Code" required/></label>

      <div class="full-span">
        <h4>Payment Verification</h4>
        <div id="paypal-payment-status" class="muted" style="margin-top: 8px;">Loading PayPal payment options…</div>
        <div id="paypal-button-container" style="margin-top: 12px;"></div>
      </div>

      <button class="glow-button wide full-span" type="submit">Submit Pre-Signup</button>
      <div class="feedback-box full-span" id="feedback" style="display:none; font-weight: 600; font-size: 1.1em; text-align: center;"></div>
    </form>
  </main>
</div>
<script>
  const PRODUCTION_BACKEND = 'https://awroadside-fire-backend.onrender.com';
  const TEMP_GENERIC_PASSWORD = 'Roadside2026!';
  const paypalState = { orderId: '', status: '', approved: false, captureId: '' };

  function getBackendBaseUrl() {
    const host = (window.location.hostname || '').toLowerCase();
    const isLocal = host === 'localhost' || host === '127.0.0.1';
    return isLocal ? window.location.origin : PRODUCTION_BACKEND;
  }

  function getAccessToken() {
    return localStorage.getItem('aw_auth_token') || localStorage.getItem('token') || '';
  }

  function setPaypalStatus(message) {
    const el = document.getElementById('paypal-payment-status');
    if (el) el.innerText = message;
  }

  async function fetchJsonWithFallback(paths, options = {}) {
    const token = getAccessToken();
    let lastError = null;
    for (const path of paths) {
      try {
        const headers = Object.assign({}, options.headers || {});
        if (token && !headers.Authorization) headers.Authorization = `Bearer ${token}`;
        const r = await fetch(path, { ...options, headers });
        const payload = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(payload?.message || payload?.error || `Request failed (${r.status})`);
        return payload;
      } catch (e) { lastError = e; }
    }
    throw lastError || new Error('Request failed');
  }

  async function ensurePaypalSdk(clientId, currency = 'USD') {
    if (window.paypal && window.paypal.Buttons) return;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}&currency=${encodeURIComponent(currency)}&intent=capture&vault=true`;
      s.async = true;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load PayPal SDK'));
      document.head.appendChild(s);
    });
  }

  async function initializePaypal() {
    const backend = getBackendBaseUrl();
    const cfg = await fetchJsonWithFallback([`${backend}/api/payments/config`, `${backend}/index.mjs/payments/config`]);
    if (!cfg?.enabled || !cfg?.clientId) {
      setPaypalStatus('PayPal is unavailable right now.');
      return;
    }
    await ensurePaypalSdk(cfg.clientId, cfg.currency || 'USD');
    setPaypalStatus('Approve PayPal before submitting pre-signup.');
    window.paypal.Buttons({
      async createOrder() {
        const order = await fetchJsonWithFallback([`${backend}/api/payments/create-order`], {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentKind: 'priority', brand_name: 'AW Roadside', description: 'AW Roadside Pre-Signup Screening - SUBSCRIBER' })
        });
        paypalState.orderId = order.orderId;
        paypalState.status = order.status || 'CREATED';
        return order.orderId;
      },
      onApprove(data) {
        paypalState.orderId = data.orderID || data.subscriptionID || '';
        paypalState.captureId = paypalState.orderId;
        paypalState.status = 'APPROVED';
        paypalState.approved = true;
        setPaypalStatus('PayPal approved. You can submit now.');
      },
      onError(err) { setPaypalStatus('PayPal error: ' + (err?.message || 'Unknown error')); }
    }).render('#paypal-button-container');
  }

  initializePaypal().catch(e => setPaypalStatus('Unable to initialize PayPal: ' + e.message));

  document.getElementById('pre-signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const feedback = document.getElementById('feedback');
    const form = e.target;
    if (!paypalState.approved) {
      setPaypalStatus('PayPal approval is required before submit.');
      return;
    }
    const fd = new FormData(form);
    const data = {
      role: fd.get('role'),
      fullName: fd.get('fullName'),
      email: fd.get('email'),
      phoneNumber: fd.get('phoneNumber'),
      zip: fd.get('zip'),
      password: TEMP_GENERIC_PASSWORD,
      pendingProfile: true,
      pendingReason: 'Awaiting application release and profile completion',
      orderId: paypalState.orderId,
      capturePaypal: true,
      captureStatus: paypalState.status,
      captureId: paypalState.captureId,
      amount: fd.get('amount'),
      currency: fd.get('currency')
    };
    const backend = getBackendBaseUrl();
    try {
      await fetchJsonWithFallback([`${backend}/api/pre-signup/subscriber`, `${backend}/index.mjs/api/pre-signup/subscriber`], {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      feedback.style.display = 'block';
      feedback.innerText = 'Pre-signup submitted. Check email for temporary password.';
    } catch (err) {
      feedback.style.display = 'block';
      feedback.innerText = 'Submission failed: ' + err.message;
    }
  });
</script>
</body>
</html>
